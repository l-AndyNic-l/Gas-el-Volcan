<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inicio Sesión | Gas El Volcán</title>
    <link rel="shortcut icon" href="img/icono.png" />
    <link rel="stylesheet" href="./css/estilos.css">
</head>
<body>
    <div class="login">
        <form class="contenedor-login" id="inicioSesion"> 
            <fieldset>
                <legend>Inicio de sesión</legend>

                <br />

                <label>Usuario o Correo electrónico</label>
                <input type ="text" placeholder="Ingrese nombre de usuario o correo" required id ="usuario">

                <br />

                <label>Contraseña</label>
                <input type ="password" placeholder="Ingrese contraseña" required id="contrasena">

                <br />

                <button type ="submit">Iniciar sesión</button>
                
                <br />
                
                <button type="button" onclick="window.location.href='registro.html'">Registrarse</button>

                <div class="volver">
                    <a href="index.html">Volver al Inicio</a>
                </div>
            </fieldset>
        </form>
    </div>

    <script src="./js/login.js"></script>  
</body>
</html>
