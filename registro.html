<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro | Gas El Volcán</title>
    <link rel="shortcut icon" href="img/icono.png" />
    <link rel="stylesheet" href="./css/estilos.css">
</head>
<body>
    <div class="registro">
        <form class="contenedor-registro" id="registroUsuario"> 
            <fieldset>
                <legend>Registro de Usuario</legend>

                <br />

                <label>Nombre Completo</label>
                <input type ="text" placeholder="Ingrese nombre completo" required id ="nombre">
                
                <br />

                <label>Usuario</label>
                <input type ="text" placeholder="Ingrese nombre de usuario" required id ="usuario">

                <br />

                <label>Correo Electrónico</label>
                <input type ="email" placeholder="Ingrese correo electrónico" required id="correo">

                <br />

                <label>Teléfono</label>
                <input type ="tel" placeholder="Ingrese teléfono ej: +569xxxxxxxx" id="telefono">

                <br />

                <label>Fecha de Nacimiento</label>
                <input type ="date" required id="fechaNacimiento">

                <br />

                <label>Contraseña</label>
                <input type ="password" placeholder="Ingrese contraseña" required id="contrasena">

                <br />

                <button type="submit">Registrarse</button>

                <br />

                <button type="button" onclick="window.location.href='login.html'">Iniciar sesión</button>

                <div class="volver">
                    <a href="index.html">Volver al Inicio</a>
                </div>
            </fieldset>
        </form>
    </div>

    <script src="./js/registro.js"></script>
</body>
</html>
